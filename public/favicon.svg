<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="256" cy="256" r="248" fill="#1A1A1A" stroke="url(#brandGrad)" stroke-width="16" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#F97316" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="8 8" />

  <!-- Flame / Grill Icon in Center -->
  <g transform="translate(156, 100)">
    <!-- Stylized Chef Hat -->
    <path d="M40 90 C10 90 0 60 20 40 C20 15 60 5 90 20 C110 5 160 5 175 25 C200 15 225 35 220 60 C235 80 220 90 200 90 Z" fill="#FFFFFF" />
    <path d="M40 85 L200 85 L190 105 L50 105 Z" fill="#F97316" />

    <!-- Searing Grill Grate Lines -->
    <path d="M10 160 C50 135 150 135 190 160" stroke="#F97316" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M25 190 C65 170 135 170 175 190" stroke="#F97316" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M45 220 C75 205 125 205 155 220" stroke="#F97316" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Central Searing Flame -->
    <path d="M100 80 C80 120 70 140 100 170 C105 150 120 140 125 120 C140 150 120 180 90 190 C130 190 150 150 130 110 C120 95 110 85 100 80 Z" fill="url(#flameGrad)" />
  </g>

  <!-- CEPE Brand Text -->
  <text x="256" y="380" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="8" text-anchor="middle">
    CEPE
  </text>
  
  <!-- Sub-label -->
  <text x="256" y="420" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#F97316" letter-spacing="6" text-anchor="middle">
    GRILLS &amp; DINER
  </text>
</svg>
